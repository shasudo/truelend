name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: # manual redeploy from the Actions tab (main only)

concurrency:
  group: ci-${{ github.ref }}
  # Cancel superseded PR runs; never cancel a main run mid-deploy.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm audit --audit-level high
      - run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  worker-artifacts:
    needs: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        app: [website, admin, partners]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build deployable Worker artifact
        run: pnpm --filter @truelend/${{ matrix.app }} worker:build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          # Cloudflare's public test key keeps PR builds deterministic. Production
          # artifacts are rebuilt below with the protected production variable.
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
      - name: Dry-run and scan Worker artifact
        run: |
          pnpm --filter @truelend/${{ matrix.app }} worker:dry-run
          node scripts/scan-worker-bundle.mjs "${{ matrix.app }}" "apps/${{ matrix.app }}/.wrangler/deploy-bundle"

  migrate:
    needs: [ci, worker-artifacts]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 10
    concurrency:
      group: database-migration
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify production configuration before mutation
        run: |
          for app in website admin partners; do
            pnpm --filter @truelend/${app} exec wrangler secret list --format json > "/tmp/${app}-worker-secrets.json"
            node scripts/assert-production-config.mjs "${app}" "/tmp/${app}-worker-secrets.json"
          done
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          HEALTHCHECK_SECRET: ${{ secrets.HEALTHCHECK_SECRET }}
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
      - name: Remove legacy Business Partner development data
        run: pnpm db:cleanup-legacy-business
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TRUELEND_PRODUCTION_DATABASE_APPROVED: "true"
          TRUELEND_LEGACY_BUSINESS_CLEANUP_APPROVED: "true"
          TRUELEND_EXPECTED_LEGACY_BUSINESS_USERS: "2"
      - run: pnpm db:preflight
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TRUELEND_PRODUCTION_DATABASE_APPROVED: "true"
      - run: pnpm db:migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TRUELEND_PRODUCTION_DATABASE_APPROVED: "true"

  deploy:
    needs: [ci, worker-artifacts, migrate]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 20
    strategy:
      # Deploy every worker; an unchanged worker is a harmless no-op version bump.
      # ponytail: every release deploys all apps; add path filtering if median deploy time exceeds 10 minutes.
      fail-fast: false
      matrix:
        app: [website, admin, partners]
    concurrency:
      group: deploy-${{ matrix.app }}
      cancel-in-progress: false # let an in-flight deploy finish; the next push supersedes after
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify protected production configuration
        run: |
          pnpm --filter @truelend/${{ matrix.app }} exec wrangler secret list --format json > /tmp/worker-secrets.json
          node scripts/assert-production-config.mjs "${{ matrix.app }}" /tmp/worker-secrets.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          HEALTHCHECK_SECRET: ${{ secrets.HEALTHCHECK_SECRET }}
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
      - name: Build production Worker artifact
        run: pnpm --filter @truelend/${{ matrix.app }} worker:build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
          NEXT_PUBLIC_CF_BEACON_TOKEN: ${{ vars.NEXT_PUBLIC_CF_BEACON_TOKEN }}
      - name: Dry-run and scan upload candidate
        run: |
          pnpm --filter @truelend/${{ matrix.app }} worker:dry-run
          node scripts/scan-worker-bundle.mjs "${{ matrix.app }}" "apps/${{ matrix.app }}/.wrangler/deploy-bundle"
      - name: Deploy with OpenNext
        run: pnpm --filter @truelend/${{ matrix.app }} worker:deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TRUELEND_PRODUCTION_DEPLOY_APPROVED: "true"
      - name: Verify release or roll back
        shell: bash
        run: |
          case "${{ matrix.app }}" in
            website) base_url="https://truelend.in" ;;
            admin) base_url="https://admin.truelend.in" ;;
            partners) base_url="https://partner.truelend.in" ;;
          esac
          if ! curl --fail --silent --show-error --retry 5 --retry-all-errors "${base_url}/api/health" >/dev/null || \
             ! curl --fail --silent --show-error --retry 5 --retry-all-errors \
               -H "Authorization: Bearer ${HEALTHCHECK_SECRET}" "${base_url}/api/health/ready" >/dev/null; then
            pnpm --filter @truelend/${{ matrix.app }} exec wrangler rollback --yes \
              --message "Automated rollback: post-deploy health verification failed"
            exit 1
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          HEALTHCHECK_SECRET: ${{ secrets.HEALTHCHECK_SECRET }}
