packages:
  - "apps/*"
  - "packages/*"

# One pinned version per dependency, shared across every package.
# Reference in package.json as "catalog:". Bump here, not in N files.
catalog:
  react: ^19.2.8
  react-dom: ^19.2.8
  next: ^16.2.12
  drizzle-orm: ^0.45.2
  postgres: ^3.4.5
  better-auth: ^1.6.25
  "@better-auth/drizzle-adapter": ^1.6.25
  tailwindcss: ^4.3.3
  tailwind-merge: ^3.6.0
  "@tailwindcss/postcss": ^4.3.3
  "@tailwindcss/typography": ^0.5.16
  "@radix-ui/react-accordion": ^1.2.20
  "@radix-ui/react-dialog": ^1.1.23
  "@radix-ui/react-slot": ^1.3.3
  lucide-react: ^1.28.0
  react-hook-form: ^7.83.0
  "@hookform/resolvers": ^5.5.7
  zod: ^4.0.0
  "@marsidev/react-turnstile": ^1.5.4
  "@next/mdx": ^16.2.12
  "@mdx-js/loader": ^3.1.0
  "@mdx-js/react": ^3.1.0
  "@types/mdx": ^2.0.13
  gray-matter: ^4.0.3
  remark-frontmatter: ^5.0.0
  "@opennextjs/cloudflare": ^1.20.2
  wrangler: ^4.118.0
  "@cloudflare/workers-types": 5.20260731.1
  drizzle-kit: ^0.31.10
  tsx: ^4.23.1
  typescript: ^7.0.2
  turbo: ^2.10.8
  prettier: ^3.9.6
  husky: ^9.1.7
  lint-staged: ^17.3.0
  eslint: ^10.8.0
  "@eslint/js": ^10.0.1
  "@eslint/eslintrc": ^3.2.0
  typescript-eslint: ^8.65.0
  eslint-config-prettier: ^10.1.8
  eslint-config-next: ^16.2.12
  eslint-plugin-jsx-a11y: ^6.10.2
  eslint-plugin-react-hooks: ^7.1.1
  globals: ^17.8.0
  "@types/node": ^26.1.2
  "@types/react": ^19.2.18
  "@types/react-dom": ^19.2.4

# Force-patch transitive advisories upstream hasn't bumped yet (applied tree-wide).
# Re-check with `pnpm audit`; drop an entry once the real dependents catch up.
overrides:
  # GHSA-r28c-9q8g-f849: prior source-map loading may disclose arbitrary .map files.
  postcss: "8.5.18"
  # GHSA-mh99-v99m-4gvg, then GHSA-rgw5-rvv9-x895 (the 5.0.8 mitigation could be
  # bypassed): force the fixed release tree-wide; retain the legacy ESM default
  # import through the narrow pnpm patch below.
  brace-expansion: "5.0.9"
  sharp: ">=0.35.0" # GHSA-f88m-g3jw-g9cj: libvips memory-safety fixes
  # GHSA-67mh-4wv8-2f99: drizzle-kit's deprecated @esbuild-kit loader pins esbuild 0.18.
  # Scope to that path only (modern tsx/wrangler esbuild untouched); 0.25.4 is already in-tree.
  "@esbuild-kit/core-utils>esbuild": "0.25.4"

# Postinstall scripts are blocked by default. Allow only the native binaries we
# use: esbuild (drizzle-kit/tsx), workerd (wrangler dev/preview/deploy),
# unrs-resolver (eslint's TS import resolver). sharp isn't needed on Workers.
allowBuilds:
  esbuild: true
  workerd: true
  unrs-resolver: true
  sharp: false

patchedDependencies:
  brace-expansion@5.0.9: patches/brace-expansion@5.0.9.patch
