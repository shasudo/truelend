packages:
  - "apps/*"
  - "packages/*"

# One pinned version per dependency, shared across every package.
# Reference in package.json as "catalog:". Bump here, not in N files.
catalog:
  # runtime
  react: ^19.0.0
  react-dom: ^19.0.0
  next: ^15.5.18
  drizzle-orm: ^0.45.2
  postgres: ^3.4.5
  # auth
  better-auth: ^1.6.23
  "@better-auth/drizzle-adapter": ^1.6.23
  # dashboards
  recharts: ^3.9.2
  papaparse: ^5.4.1
  "@types/papaparse": ^5.3.14
  # ui / styling
  tailwindcss: ^4.1.0
  "@tailwindcss/postcss": ^4.1.0
  "@tailwindcss/typography": ^0.5.16
  radix-ui: ^1.4.0
  lucide-react: ^0.525.0
  motion: ^12.23.0
  # forms
  react-hook-form: ^7.60.0
  "@hookform/resolvers": ^5.2.2
  zod: ^4.0.0
  "@marsidev/react-turnstile": ^1.3.0
  # blog (mdx)
  "@next/mdx": ^15.5.0
  "@mdx-js/loader": ^3.1.0
  "@mdx-js/react": ^3.1.0
  "@types/mdx": ^2.0.13
  gray-matter: ^4.0.3
  remark-frontmatter: ^5.0.0
  # cloudflare / deploy
  "@opennextjs/cloudflare": ^1.0.0
  wrangler: ^4.86.0
  "@cloudflare/workers-types": ^5.20260708.1
  drizzle-kit: ^0.31.10
  # build / dev tooling
  tsx: ^4.20.0
  typescript: ^5.7.0
  turbo: ^2.3.0
  prettier: ^3.4.0
  # linting
  eslint: ^9.17.0
  "@eslint/js": ^9.17.0
  "@eslint/eslintrc": ^3.2.0
  typescript-eslint: ^8.18.0
  eslint-config-prettier: ^9.1.0
  eslint-config-next: ^15.1.0
  globals: ^15.14.0
  # types
  "@types/node": ^22.10.0
  "@types/react": ^19.0.0
  "@types/react-dom": ^19.0.0

# Postinstall scripts are blocked by default. Allow only the native binaries we
# use: esbuild (drizzle-kit/tsx), workerd (wrangler dev/preview/deploy),
# unrs-resolver (eslint's TS import resolver). sharp isn't needed on Workers.
allowBuilds:
  esbuild: true
  workerd: true
  unrs-resolver: true
  sharp: false
